[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cavalry87"
version = "0.1.0"
description = "Control software for the Durgod Cavalry 87W keyboard"
requires-python = ">=3.12"
dependencies = ["hidapi>=0.14", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: needs the real keyboard; run with -m hardware"]
addopts = "-m 'not hardware'"
